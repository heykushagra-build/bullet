<style>
/* Layout: one scrolling story in chapters. Single light theme by choice: white paper, navy ink, one blue accent. */
:root{
  color-scheme:light;
  --paper:#ffffff; --tint:#f4f7fb; --ink:#0a1f33; --body:#334455; --muted:#6b7a89; --rule:#e2e7ee;
  --blue:#1f4fd8; --navy:#0a1f33; --sky:#9db7f0; --pale:#dbe5fb; --orange:#c2410c; --red:#b42318; --green:#18794e;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;color:var(--ink);font-family:var(--serif);font-weight:600;text-wrap:balance}
h1{font-size:clamp(30px,4.2vw,48px);line-height:1.12;letter-spacing:-.015em;max-width:30ch}
h2{font-size:clamp(25px,3vw,34px);line-height:1.2;letter-spacing:-.01em;max-width:40ch}
h3{font-size:20px;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(255,255,255,.97);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:24px;height:56px}
.brand{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink);white-space:nowrap}
.top nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.top nav button,.top nav a{background:none;border:0;cursor:pointer;font-size:14px;color:var(--muted);padding:6px 10px;white-space:nowrap;text-decoration:none}
.top nav button:hover,.top nav a:hover{color:var(--ink)}
.top nav .on{color:var(--ink);font-weight:600}

.ch{padding-block:84px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:32px;scroll-margin-top:56px}
.ch:first-child{border-top:0;padding-top:64px}
.kick{font-family:var(--serif);font-size:18px;color:var(--blue)}
.lead{font-size:19px;color:var(--body);max-width:62ch;margin-top:-16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}
.cap{font-size:15px;color:var(--muted)}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--sans);fill:var(--muted);font-size:13px}
.scroll{overflow-x:auto}

.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink)}
.big div{padding:20px 20px 0 0;display:flex;flex-direction:column;gap:6px}
.big div+div{padding-left:20px;border-left:1px solid var(--rule)}
.big b{font-family:var(--serif);font-weight:600;font-size:clamp(30px,3.6vw,44px);color:var(--ink);line-height:1}
.big span{font-size:15px;color:var(--muted)}

.edges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.edge b{display:block;font-family:var(--serif);font-size:clamp(30px,3.4vw,44px);color:var(--blue);line-height:1;margin-bottom:10px}
.edge h3{margin-bottom:6px}
.edge p{color:var(--muted)}

.mx{display:grid;grid-template-columns:minmax(200px,1.6fr) repeat(4,minmax(96px,1fr));min-width:660px}
.mx>div{padding:14px 8px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:center;min-width:0}
.mx .h{font-weight:600;color:var(--ink);border-bottom:2px solid var(--ink)}
.mx .h:first-child,.mx .rn{justify-content:flex-start}
.mx .rn{font-weight:600;color:var(--ink);gap:10px}
.mx .g{grid-column:1/-1;justify-content:flex-start;font-family:var(--serif);font-size:18px;color:var(--ink);padding-top:26px;border-bottom:0}
.bub{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer}
.bub i{display:block;border-radius:50%}
.bub b{font-size:14px;color:var(--ink)}
.bub small{font-size:12.5px;color:var(--muted)}
.dash{color:var(--rule);font-size:22px}
.tip{display:none;position:absolute;z-index:8;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:260px;text-align:left;background:var(--paper);border:1px solid var(--ink);padding:14px;font-size:14px;line-height:1.4;box-shadow:0 10px 30px rgba(10,31,51,.12)}
.tip p+p{margin-top:8px}
.tip p span{display:block;color:var(--muted);font-size:13px}
.bub:hover .tip,.bub:focus .tip,.bub.open .tip{display:block}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}

table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
td.r,th.r{text-align:right}
tr.grp td{font-family:var(--serif);font-size:17px;color:var(--ink);padding-top:22px}
tr.sub td{font-weight:700;color:var(--ink)}
tr.tot td{font-weight:700;color:var(--ink);border-top:2px solid var(--ink);border-bottom:0}

.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ph{background:var(--tint);padding:22px 30px 22px 32px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%);display:flex;flex-direction:column;gap:4px;min-height:140px}
.ph:first-child{padding-left:24px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%)}
.ph.on{background:var(--ink)} .ph.on *{color:#fff}
.ph h3{font-size:24px}
.ph .y{font-size:14px;color:var(--muted)}
.ph p{margin-top:auto;font-size:15px}

/* roadmap: one-screen year view */
.yrs{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr)) 44px;border-bottom:2px solid var(--ink)}
.yrs button{background:none;border:0;cursor:pointer;padding:10px 8px 12px;text-align:left;border-bottom:4px solid transparent;margin-bottom:-2px;display:flex;flex-direction:column;gap:2px}
.yrs button span{font-size:13px;color:var(--muted)}
.yrs button b{font-family:var(--serif);font-size:22px;color:var(--muted)}
.yrs button[aria-selected="true"]{border-bottom-color:var(--blue)}
.yrs button[aria-selected="true"] b{color:var(--ink)}
.yrs .arrow{align-items:center;justify-content:center;font-size:22px;color:var(--ink)}
.yrs .arrow:disabled{color:var(--rule);cursor:default}
.ypanel{display:flex;flex-direction:column;gap:28px;padding-top:28px}
.yhead{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));border-bottom:1px solid var(--rule);padding-bottom:24px;gap:24px}
.yhead h3{font-size:clamp(24px,2.6vw,30px)}
.yhead .k{display:flex;flex-direction:column;gap:4px}
.yhead .k span{font-size:14px;color:var(--muted)}
.yhead .k b{font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1.15;font-weight:600}
.ybody{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:48px}
.mvr{display:grid;grid-template-columns:170px minmax(0,1fr) 20px;gap:16px;padding:14px 0;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer;width:100%;align-items:start}
.mvr .f{font-size:14.5px;color:var(--muted);padding-top:2px}
.mvr b{display:block;font-family:var(--serif);font-size:18.5px;color:var(--ink);font-weight:600;line-height:1.25}
.mvr .o{display:block;color:var(--blue);font-size:15px;margin-top:3px}
.mvr .pl{color:var(--muted);font-size:18px;line-height:1}
.mvr .x{display:none;margin-top:10px;font-size:15px}
.mvr .x p+p{margin-top:4px}
.mvr .x span{color:var(--muted);display:inline-block;min-width:76px}
.mvr[aria-expanded="true"] .x{display:block}
.side{display:flex;flex-direction:column;gap:32px}
.side h4{margin:0 0 10px;font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:600}
.miss p{border-left:3px solid var(--red);padding-left:12px;font-size:15px}
.miss p+p{margin-top:10px}

.must{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;counter-reset:m}
.must div{border-top:2px solid var(--ink);padding-top:14px;counter-increment:m}
.must div::before{content:counter(m);font-family:var(--serif);font-size:40px;color:var(--blue);display:block;line-height:1;margin-bottom:10px}
.must h3{font-size:19px;margin-bottom:6px}
.must p{color:var(--muted);font-size:15px}

.filters{display:flex;gap:12px;flex-wrap:wrap}
.filters input,.filters select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.ok{color:var(--green)} .no{color:var(--red)} .muted{color:var(--muted)}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:12px 18px;font-weight:600}

.big.hk{grid-template-columns:repeat(2,minmax(0,1fr))}
.hk b{font-family:var(--serif);font-size:30px;color:var(--ink);display:block}.hk span{color:var(--muted);font-size:14px}
.hacks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px 32px;margin-top:28px}
.hack{border-top:2px solid var(--ink);padding-top:14px}.hack h3{margin:6px 0 8px}.hack p{margin:0 0 10px}
.hn{font-family:var(--serif);font-size:28px;color:var(--blue)}.hb{height:10px;background:var(--rule);margin:6px 0 8px}.hb i{display:block;height:100%;background:var(--blue)}
.hv{font-size:15px}.small{font-size:13.5px}
@media (max-width:900px){
  .two,.ybody{grid-template-columns:minmax(0,1fr);gap:40px}
  .yhead{grid-template-columns:1fr 1fr}
  .yhead>div:first-child{grid-column:1/-1}
  .big{grid-template-columns:1fr 1fr}
  .big div:nth-child(3){padding-left:0;border-left:0}
  .edges,.must{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .phases{grid-template-columns:1fr 1fr}
  .ph,.ph:first-child{clip-path:none;padding-left:24px}
  .yrs{grid-template-columns:36px repeat(7,minmax(64px,1fr)) 36px;overflow-x:auto}
  .ch{padding-block:64px}
}
@media (max-width:560px){
  table{font-size:13.5px} th,td{padding-left:5px;padding-right:5px}
  .big,.big.hk,.edges,.must,.phases,.yhead{grid-template-columns:minmax(0,1fr)}
  .big div+div{padding-left:0;border-left:0;border-top:1px solid var(--rule)}
  .mvr{grid-template-columns:minmax(0,1fr) 20px}
  .mvr .f{grid-column:1/-1}
  .tip{left:0;transform:none}
}
</style>

al app is the biggest single product. Story series for brands are the biggest B2B product, paid from budgets brands spend on static posts today.", "seq_l": "Revenue grows from ₹12 cr in FY27 to ₹2,512 cr in FY32. Bullet breaks even in FY31 and earns 11% EBITDA in FY32.", "money_h": "Bullet needs about ₹950 cr in three rounds and keeps at least ₹150 cr in the bank", "money_l": "Zee's ₹150 cr is drawn in FY27. Round 1 of ₹250 cr comes on India results. Round 2 of ₹550 cr comes only after the US test passes, with ₹200 cr from Zee so it keeps about 52% after the IPO.", "risk_h": "Two risks could break the plan: India going free and returns abroad falling at scale", "val": [["India only", 4200, 6300], ["Plan", 10048, 15072], ["Bull case", 12000, 18000]], "pnl_note": "Kuku spent 74% of revenue on marketing in FY26 and ReelShort about 55%. Bullet spends about 56% on its consumer apps in FY32, close to ReelShort, and 34% overall because B2B needs no user acquisition. Ad spend abroad is modelled by cohort: each year of spend earns back 1.0x in year one and about 1.5x over three years.", "hack_h": "Five growth hacks could lift FY32 EBITDA from 11% to about 16% and cut cash burned by about ₹170 cr", "hack_l": "They are upside and are not in the plan numbers. Test the Zee QR code with the ₹1 trial first, in the next 90 days. It also proves that a paying user can cost ₹280."}, "scenarios": [["Bear", 650, "Paid growth, thin Zee support [S]"], ["India only", 1050, "Global app and US B2B do not work"], ["Base (the plan)", 2512, "India + ~2% of five rich markets + B2B, as hypotheses with gates"], ["Bull", 3000, "~3–4% share abroad; faster B2B adoption"], ["Ceiling, FY34–35", 3750, "Universe estimate [S]"]], "wont": [["Consumer AI apps (Tarang), 'one key, every model' APIs", "No right to win; vapourware risk in diligence [S]"], ["Standalone dubbing, own VFX house, general AI video models", "Commodity or already won by others [S]"], ["Selling the core stack to rival Indian apps", "They built their own [S]"], ["Fan gifting rooms, shoppable episodes, out-of-home", "No social graph; needs 10M MAU; SugarBox lesson [S]"], ["Scaling a market before its test pays back", "Every market must earn back its ad spend first"], ["Acquisitions before profit", "Protect the cash floor; buy libraries after FY31"], ["LatAm, Southeast Asia, Africa as own-app markets", "Huge downloads, low spend; licensing only"], ["Japan, Korea, France as own-app markets before FY33", "Harder to enter; only with a local partner after listing"], ["Kids, adult, political content; real-money gaming, astrology", "Regulatory and brand-safety red lines [S]"]], "sources": [["Research brief and opportunity universe (26 Nov 2026)", "Fact base: Bullet today, market sizes, Kuku, Zee, expert reviews", null], ["Sensor Tower: State of Short Drama Apps 2025", "US ~49% of global short-drama app revenue", "https://sensortower.com/blog/state-of-short-drama-apps-2025"], ["The Movie Waffler (Sensor Tower data)", "$2.98B global short-drama in-app revenue in 2025, +115%", "https://www.themoviewaffler.com/2026/11/short-drama-apps-turn-micro-episodes-into-a-billion-dollar-business.html"], ["THR India", "Kuku releases 200–250 shows a month", "https://www.hollywoodreporterindia.com/features/insight/indias-microdrama-boom-how-data-desire-and-aritifical-intelligence-are-reshaping-entertainment"], ["Vertical Charts", "Install D30 ~1% Story TV, ~2% Kuku TV", "https://verticalcharts.com/india-micro-drama-fasttv-t-series-hungama-story-tv-retention-vertical-52/"], ["TechCrunch", "Pocket FM ~1,000 pilots a month", "https://techcrunch.com/2024/11/27/audio-platform-pocket-fm-taps-into-ai-tools-help-it-expand-content-catalog"], ["Social Samosa / TAM AdEx", "~6,100 TV advertisers (Jan–Sep 2025)", "https://www.socialsamosa.com/report/tv-ad-volumes-drop-10-percent-2025-fmcg-ecommerce-drive-growth-report-10623973"], ["Storyboard18 / TAM AdEx", "187,000+ digital advertisers in 2025", "https://www.storyboard18.com/digital/amazon-emerges-as-largest-digital-advertiser-in-jan-sep-2025-followed-by-flipkart-and-hul-tam-86162.htm"], ["NAICS Association", "~5,160 US companies above $1B revenue", "https://naics.com/business-lists/counts-by-company-size/"], ["UK Department for Business and Trade", "8,335 large UK businesses (2025)", "https://www.gov.uk/government/statistics/business-population-estimates-2025/business-population-estimates-for-the-uk-and-regions-2025-statistical-release"], ["Drop Media; AI Vidia; Axis AI Studios", "Branded micro-drama series cost $40K–$500K; Crocs, P&G Native, Channel 4 examples", "https://www.dropmedia.co.uk/brands-and-vertical-drama-deals-budgets-ip-ownership-and-more/"], ["Kantar", "40% of marketers test little or none of their creative; cost is the top reason", "https://www.kantar.com/north-america/inspiration/agile-market-research/how-earlier-ad-testing-supercharges-creative-roi"], ["Mordor Intelligence", "Branded content services ~$81B globally (2025), 38% North America", "https://www.mordorintelligence.com/industry-reports/branded-content-services-market"], ["User-provided", "Pocket Saga ~$50M ARR scaling to ~$100M; ~120% Meta spend recovered by month 2–3", null]], "assumptions": ["India app: 60M monthly users and 5% paying by FY32 gives 3M payers at ₹1,250 a year. Ads assume 80% of slots sold to non-paying daily users.", "Abroad: about 2% share in each of five rich markets. Players ranked 4 to 6 outside China hold 6–13% each today.", "Marketing is built bottom-up: India payers acquired × cost per payer. Abroad, by cohort: each year of ad spend earns back 1.0x in year one, 0.35x in year two and 0.15x in year three.", "B2B: branded shows sized from product-placement budgets moving to micro-drama. Story ads sized from the creative budget brands already spend: 10–20% of it moves from static posts to short story series by FY32.", "Capital: ₹950 cr in three rounds, including ₹350 cr from Zee. Cash never falls below ₹150 cr after Round 1. Zee keeps about 52% after the IPO.", "EBITDA, fixed costs and the 4–6x multiple are estimates within comparables. SEBI points need legal confirmation."], "ideas": [{"n": "Story Studio (100–200 shows a month)", "d": "Accepted", "w": "Story supply is the bottleneck; rivals release 150–250 shows a month."}, {"n": "Global app in five rich markets", "d": "Accepted", "w": "About 2% of the US, UK, Canada, Australia, Germany and the Gulf, with local remakes of Indian hits."}, {"n": "Story ads: short brand story series", "d": "Accepted", "w": "3–4 part story series for Instagram and YouTube, paid from budgets brands spend on static posts today."}, {"n": "Branded shows for large brands, India and abroad", "d": "Accepted", "w": "Product placement money moves to where viewers are; US is the largest market."}, {"n": "Studio Test Lab", "d": "Accepted", "w": "Studios test a film as a short AI drama before a big spend."}, {"n": "Brand Studio, Zee-wide mandate", "d": "Accepted", "w": "Already live with 3 brands, sold by Zee's sales team, and pays cash while consumer revenue builds. Booked net (70% of gross) and at confidence 0.7 because deal terms are undisclosed."}, {"n": "Syndication + second windows (YouTube, FAST, OTTs)", "d": "Accepted", "w": "Earns from the same library again and again at near-zero cost. High margin and already live."}, {"n": "Zee library recuts + spin-offs (women 25-55)", "d": "Accepted", "w": "Highest right to win (5/5): no startup has Zee's soap library or its women 25–55 audience. Six other ideas depend on it."}, {"n": "India coins + weekly pass (Hindi + regional)", "d": "Accepted", "w": "Biggest pool and already earning. We can win it through Zee's own reach at ₹5–15 per user; paid installs at ₹100–200 would lose money."}, {"n": "Studio OS (internal cost savings)", "d": "Cost lever", "w": "A cost lever, not revenue: cuts production cost for Bullet and Zee (₹120–200 cr savings). Already live and unlocks five Trinetra ideas."}, {"n": "In-app ads (rewarded unlock, Zee-sold)", "d":   let lastM=M(); addEventListener("resize",()=>{ if(M()!==lastM){ lastM=M(); gCac(); gTree(); gPath(); } });
  gMkt(); gKuku(); gCac(); gTree(); gPath(); yrs(); gCash(); gFund(); gVal(); gRisk();
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.go).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}));
  document.querySelectorAll(".bub").forEach(b=>b.addEventListener("click",()=>{ const o=!b.classList.contains("open"); document.querySelectorAll(".bub.open").forEach(x=>x.classList.remove("open")); if(o) b.classList.add("open"); }));
  document.addEventListener("keydown",e=>{ if(!document.getElementById("roadmap")) return; const r=document.getElementById("roadmap").getBoundingClientRect(); if(r.top>innerHeight||r.bottom<0) return; if(e.key==="ArrowRight"&&yi<D.years.length-1){yi++;openMove=null;yrs();} if(e.key==="ArrowLeft"&&yi>0){yi--;openMove=null;yrs();} });
  if("IntersectionObserver" in window){ const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===e.target.id)); }),{rootMargin:"-40% 0px -55% 0px"}); document.querySelectorAll(".ch").forEach(s=>io.observe(s)); }
}
window.addEventListener("hashchange",render);
render();
</script>
